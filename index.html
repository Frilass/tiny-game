<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
      Relative URLs throughout so the game works from file://, a local
      static server, and GitHub Pages under a project subpath.
      The tags below are what iOS needs to add this to the home screen
      and open it without Safari chrome (standalone, edge-to-edge).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slime Pit">
    <meta name="theme-color" content="#1a120c">
    <meta name="format-detection" content="telephone=no">
    <meta name="description" content="An idle dungeon. Your knight hunts slimes while you spend the gold.">
    <title>Slime Pit</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <!--
      These few rules sit after the stylesheet on purpose. The previous
      Tiny Game cache can still hand back its style.css (every button
      width: 100%) for one paint. Without a size on the canvas, the game
      loop measured that button-stretched stage and grew the bitmap without
      bound, so the phone showed a giant Reset and a black screen. Inline
      rules win over that stale sheet. style.css restyles the same elements
      once the fresh file arrives.
    -->
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #1a120c;
            overflow: hidden;
        }
        body { display: block; }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #stage {
            flex: 1 1 auto;
            min-height: 160px;
            position: relative;
        }
        #game {
            display: block;
            width: 100%;
            height: 100%;
        }
        #reset {
            width: auto;
            max-width: 6rem;
            font-size: 12px;
            padding: 8px;
        }
        #shop-buttons,
        #gold-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .upgrade, #start, #summary-menu, #reset { width: auto; }
        #menu, #run { min-height: 0; }
    </style>
</head>
<body>
    <script>
        // Register before the game scripts. A stale stylesheet used to hang
        // the first paint; waiting until the bottom of game.js meant the
        // new worker never got to replace that sheet. file:// has no
        // service worker, so anything but http(s) is skipped.
        (function () {
            if (location.protocol !== "http:" && location.protocol !== "https:") {
                return;
            }
            if (!("serviceWorker" in navigator)) {
                return;
            }
            var reloading = false;
            navigator.serviceWorker.addEventListener("controllerchange", function () {
                if (reloading) {
                    return;
                }
                var now = Date.now();
                var recent = [];
                try {
                    recent = JSON.parse(sessionStorage.getItem("slime-pit-sw-reloads") || "[]");
                } catch (err) {
                    recent = [];
                }
                recent = recent.filter(function (stamp) { return now - stamp < 10000; });
                if (recent.length >= 2) {
                    return;
                }
                recent.push(now);
                try {
                    sessionStorage.setItem("slime-pit-sw-reloads", JSON.stringify(recent));
                } catch (err) {}
                reloading = true;
                location.reload();
            });
            navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).catch(function () {});
        })();
    </script>
    <div id="app">
        <section id="menu">
            <h1>Slime Pit</h1>
            <p class="blurb">Ten floors. Clear each one. Gold stays with you. A death sends you back here, level 1.</p>
            <button id="start" type="button">Start Run</button>
            <p class="gold-line"><span class="coin" aria-hidden="true"></span><strong id="menu-gold">0</strong> gold</p>
            <p id="perm-stats">Power 5  ·  HP 48  ·  Speed 1.0</p>
            <section id="gold-shop" aria-label="Gold shop">
                <h2>Gold shop</h2>
                <div id="gold-buttons"></div>
            </section>
            <p id="menu-note" role="status"></p>
            <button id="reset" type="button">Reset save</button>
        </section>

        <section id="run" hidden>
            <header id="hud">
                <div class="stats">
                    <div class="stat"><span class="label">Floor</span><strong id="floor">1</strong></div>
                    <div class="stat"><span class="label">Left</span><strong id="left">0</strong></div>
                    <div class="stat"><span class="label">Lv</span><strong id="level">1</strong></div>
                    <div class="stat"><span class="label">Str</span><strong id="strength">5</strong></div>
                    <div class="stat gold"><span class="coin" aria-hidden="true"></span><strong id="gold">0</strong></div>
                </div>
                <div class="meter">
                    <div class="meter-label"><span>HP</span><span id="hpText">48/48</span></div>
                    <div class="track" id="hpTrack" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="48" aria-valuenow="48">
                        <div id="hpFill"></div>
                    </div>
                </div>
                <div class="meter">
                    <div class="meter-label"><span>XP</span><span id="xpText">0/26</span></div>
                    <div class="track" id="xpTrack" role="meter" aria-label="Experience toward the next level" aria-valuemin="0" aria-valuemax="26" aria-valuenow="0">
                        <div id="xpFill"></div>
                    </div>
                </div>
            </header>

            <div id="stage">
                <canvas id="game" width="520" height="320" aria-label="Dungeon floor. Your knight fights slimes automatically."></canvas>
                <p id="toast" role="status" aria-live="polite"></p>
            </div>

            <section id="shop" aria-label="XP shop">
                <h2 id="shop-title">XP shop</h2>
                <div id="shop-buttons"></div>
            </section>

            <div id="summary" hidden role="dialog" aria-labelledby="summary-title">
                <h2 id="summary-title">Defeated</h2>
                <p id="summary-floor">Reached floor 1.</p>
                <p id="summary-gold">Gold earned: 0</p>
                <button id="summary-menu" type="button">Menu</button>
            </div>
        </section>
    </div>

    <noscript><p class="noscript">Slime Pit needs JavaScript to run.</p></noscript>

    <!--
      Classic scripts (not modules) so the game still runs from file://.
      Order matters: catalogs, then save, then drawing, then the loop.
    -->
    <script src="js/enemies.js"></script>
    <script src="js/upgrades.js"></script>
    <script src="js/save.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
